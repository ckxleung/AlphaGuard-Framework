name: AlphaGuard Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install "coverage>=7.6.0"
      - name: Run contract tests with coverage
        run: |
          python -m coverage run --source=src,evaluation_kernels -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --fail-under=80
      - name: Validate repository
        run: python -m src.repository_validator
      - name: Compile Python sources
        run: python -m compileall -q src evaluation_kernels tests
