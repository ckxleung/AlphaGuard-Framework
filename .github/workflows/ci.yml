name: AlphaGuard Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install "coverage>=7.6.0" "pip-audit>=2.10.1"
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run contract tests with coverage
        run: |
          python -m coverage run --source=src,evaluation_kernels -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --fail-under=80
      - name: Validate repository
        run: python -m src.repository_validator
      - name: Validate monitoring control plane
        run: |
          python src/monitoring_control_plane.py \
            --event examples/monitoring_event.example.json
          python src/monitoring_control_plane.py \
            --event examples/monitoring_event.example.json \
            --module-payloads examples/module_payloads.financing.synthetic.json
      - name: Validate institutional publication contract
        run: |
          python src/output_standard.py examples/publication_artifact.example.json
      - name: Validate cross-market temporal engine
        run: python src/market_clock.py
      - name: Compile Python sources
        run: python -m compileall -q src evaluation_kernels tests
