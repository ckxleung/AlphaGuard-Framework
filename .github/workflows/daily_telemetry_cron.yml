name: AlphaGuard Daily Telemetry Loop

on:
  schedule:
    # Runs at 04:00 HKT, which is 20:00 UTC on the previous day.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install institutional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute autonomous forensic audit pipeline
        run: python src/main_pipeline.py
