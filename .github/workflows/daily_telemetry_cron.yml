name: AlphaGuard Daily Telemetry Loop

on:
  schedule:
    # Runs at 04:00 HKT, which is 20:00 UTC on the previous day.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install institutional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate repository contracts
        run: python -m src.repository_validator

      - name: Generate planning-only monitored-enterprise baseline
        run: |
          mkdir -p outputs
          python src/monitoring_control_plane.py \
            --portfolio-baseline \
            > outputs/portfolio_baseline_plan.json

      - name: Run deterministic synthetic smoke audit
        run: python src/main_pipeline.py

      - name: Upload routing plan
        uses: actions/upload-artifact@v4
        with:
          name: alphaguard-portfolio-baseline-plan
          path: outputs/portfolio_baseline_plan.json
          if-no-files-found: error
          retention-days: 14
